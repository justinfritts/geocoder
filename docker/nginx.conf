server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index geocoder.html;

    gzip on;
    gzip_types text/css text/plain text/csv application/javascript;

    # The page itself (`/` lands here via index): always revalidate, so a rebuilt image is
    # picked up on the next load.
    location = /geocoder.html {
        add_header Cache-Control "no-cache";
    }

    # Shards exist only as .gz (see Dockerfile). No try_files here: it would look for the
    # uncompressed file, which is deliberately absent, and 404 before gzip_static runs.
    location /data/ {
        gzip_static always;
        gunzip on;
        add_header Cache-Control "public, max-age=86400";
    }
}
